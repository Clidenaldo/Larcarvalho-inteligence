name: larcarvalho-intelligence

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-3000}
      BACKEND_INTERNAL_URL: http://backend:3001
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
      PUBLIC_SIMULATOR_TIMEOUT_MS: ${PUBLIC_SIMULATOR_TIMEOUT_MS:-5000}
      PUBLIC_WHATSAPP_NUMBER: ${PUBLIC_WHATSAPP_NUMBER:-}
      PUBLIC_PRIVACY_POLICY_URL: ${PUBLIC_PRIVACY_POLICY_URL:-}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3001
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-3000}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_URL: postgresql://${POSTGRES_USER:-larcarvalho}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}@postgres:5432/${POSTGRES_DB:-larcarvalho}?schema=public
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PUBLIC_SIMULATOR_CANDIDATE_LIMIT: ${PUBLIC_SIMULATOR_CANDIDATE_LIMIT:-100}
      PUBLIC_SIMULATOR_RATE_LIMIT_MAX: ${PUBLIC_SIMULATOR_RATE_LIMIT_MAX:-30}
      PUBLIC_SIMULATOR_RATE_LIMIT_WINDOW_MS: ${PUBLIC_SIMULATOR_RATE_LIMIT_WINDOW_MS:-600000}
      PUBLIC_SIMULATOR_TIMEOUT_MS: ${PUBLIC_SIMULATOR_TIMEOUT_MS:-5000}
      PUBLIC_LEAD_RATE_LIMIT_MAX: ${PUBLIC_LEAD_RATE_LIMIT_MAX:-10}
      PUBLIC_LEAD_RATE_LIMIT_WINDOW_MS: ${PUBLIC_LEAD_RATE_LIMIT_WINDOW_MS:-600000}
      REQUEST_BODY_LIMIT_BYTES: ${REQUEST_BODY_LIMIT_BYTES:-1048576}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/api/v1/ready',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles: ['database']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-larcarvalho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}
      POSTGRES_USER: ${POSTGRES_USER:-larcarvalho}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
